<script type="text/javascript">
    RED.nodes.registerType('matterfan',{
        category: 'Matter',
        color: '#289db6',
        icon: "font-awesome/fa-dot-circle-o ",
        inputs:1,
        outputs:1,
        defaults: {
            name: {value:""},
            bridge: { value: "", type: "matterbridge", required: true },
            passthrough: {value: true},
            levelstep: {value: 1},
            bat: {value : false},
            topic: {}
        },
        label: function() {
            return this.name||"Fan";
        },
        paletteLabel: "Fan"

    });
</script>

<script type="text/x-red" data-template-name="matterfan">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-config-input-bridge">Bridge</label>
        <input type="text" id="node-input-bridge" style="width:70%;">
    </div>
    <div class="form-row">
        <label for="node-input-passthrough">Passthrough Input msg to Output</label>
        <select type="text" id="node-input-passthrough" style="width:50%;" >
            <option value=true>True</option>
            <option value=false>False</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-levelstep">Value for Level Step Change</label>
        <input type="text" id="node-input-levelstep" placeholder="1">
    </div>
    <div class="form-row">
        <label for="node-input-bat">Battery</label>
        <select type="text" id="node-input-bat" style="width:50%;" >
            <option value=false>None</option>
            <option value="recharge">Rechargeable</option>
            <option value="replace">Replaceable</option>
        </select>
    </div>
     <div class="form-row">
        <label for="node-input-topic">Topic</label>
        <input type="text" id="node-input-topic" placeholder="Topic for new msgs">
    </div>
</script>

<script type="text/x-red" data-help-name="matterfan">
    <p>A bridged Matter fan.</p>
    <h3>Inputs</h3>
    <p>Send an object in <code>msg.payload</code>. Omitted properties keep their
    current values.</p>
    <dl class="message-properties">
        <dt class="optional">payload.percent <span class="property-type">number</span></dt>
        <dd>Fan percentage, 0-100. <code>payload.level</code> is also accepted;
        <code>percent</code> takes precedence when both are supplied.</dd>
        <dt class="optional">payload.mode <span class="property-type">number</span></dt>
        <dd>Matter fan mode: 0 off, 1 low, 2 medium, 3 high, 5 auto.</dd>
        <dt class="optional">payload.direction <span class="property-type">number</span></dt>
        <dd>Airflow direction: 0 forward or 1 reverse.</dd>
        <dt class="optional">payload.rock <span class="property-type">boolean</span></dt>
        <dd>Enable or disable left/right oscillation.</dd>
        <dt class="optional">payload.increaseLevel</dt>
        <dd>Increase the current percentage by Level Step, up to 100.</dd>
        <dt class="optional">payload.decreaseLevel</dt>
        <dd>Decrease the current percentage by Level Step, down to 0.</dd>
    </dl>
    <p>For example: <code>msg.payload = { mode: 3, percent: 75 }</code>.</p>
    <h3>Outputs</h3>
    <p><code>msg.payload</code> contains <code>mode</code>, <code>percent</code>,
    <code>direction</code> and <code>rock</code> with the values described above.</p>
    <h3>Details</h3>
    <p>With passthrough enabled, input messages are output with the updated state.
    With passthrough disabled, output caused by input messages is suppressed.
    Changes received from a Matter controller produce a new message.</p>
</script>
